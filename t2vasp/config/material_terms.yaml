# ── Calculation type keywords ────────────────────────────────────────
calc_type_keywords:
  relax:
    ja: ["構造最適化", "最適化", "緩和", "リラックス", "relax", "構造緩和", "イオン緩和"]
    en: ["optimize", "relax", "relaxation", "structure optimization", "ionic relaxation"]
  static:
    ja: ["静的計算", "SCF", "シングルポイント", "single point"]
    en: ["static", "single point", "SCF", "self-consistent"]
  dos:
    ja: ["状態密度", "DOS", "バンドギャップ", "電子状態"]
    en: ["density of states", "DOS", "band gap", "electronic structure"]
  band:
    ja: ["バンド構造", "バンド分散", "エネルギーバンド"]
    en: ["band structure", "band dispersion", "energy band"]
  crystal_field:
    ja: ["結晶場", "配位場", "t2g", "eg", "CFSE", "結晶場分裂", "ヤーンテラー", "ヤーン・テラー", "Jahn-Teller"]
    en: ["crystal field", "ligand field", "t2g/eg", "CFSE", "Jahn-Teller"]
  phonon:
    ja: ["フォノン", "格子振動", "振動数", "フォノン分散"]
    en: ["phonon", "lattice vibration", "vibrational", "phonon dispersion"]
  elastic:
    ja: ["弾性定数", "弾性率", "弾性テンソル", "バルクモジュラス"]
    en: ["elastic", "elastic constant", "bulk modulus", "elastic tensor"]
  polarization:
    ja: ["分極", "自発分極", "Berry phase", "ベリー位相", "圧電", "強誘電"]
    en: ["polarization", "spontaneous polarization", "Berry phase", "piezoelectric", "ferroelectric"]
  dielectric:
    ja: ["誘電", "誘電定数", "誘電率", "誘電テンソル"]
    en: ["dielectric", "dielectric constant", "dielectric tensor", "permittivity"]
  magnetic:
    ja: ["磁性", "磁気モーメント", "スピン", "磁化", "反強磁性", "強磁性", "フェリ磁性"]
    en: ["magnetic", "magnetism", "spin", "magnetization", "antiferromagnetic", "ferromagnetic"]
  neb:
    ja: ["NEB", "反応経路", "遷移状態", "拡散経路", "活性化エネルギー"]
    en: ["NEB", "nudged elastic band", "transition state", "diffusion path", "activation energy"]
  md:
    ja: ["分子動力学", "MD", "AIMD", "動力学", "温度"]
    en: ["molecular dynamics", "MD", "AIMD", "ab initio MD"]
  sqs:
    ja: ["SQS", "ランダム固溶体", "擬似ランダム", "固溶体"]
    en: ["SQS", "special quasirandom", "random solid solution", "solid solution"]

