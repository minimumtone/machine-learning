<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
        }
        
        .metronome-container {
            text-align: center;
            padding: 20px;
        }
        
        .control-button {
            font-size: 24px;
            padding: 15px 40px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .start-button {
            background: #4CAF50;
            color: white;
        }
        
        .start-button:hover {
            background: #45a049;
        }
        
        .stop-button {
            background: #f44336;
            color: white;
        }
        
        .stop-button:hover {
            background: #da190b;
        }
        
        .beat-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
        }
        
        .beat {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ddd;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .beat.active {
            background: #4CAF50;
            transform: scale(1.3);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.6);
        }
        
        .beat.accent {
            border: 3px solid #FF9800;
        }
        
        .status {
            font-size: 18px;
            margin: 20px 0;
            color: #666;
        }
        
        .bpm-display {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="metronome-container">
        <div class="bpm-display" id="bpmDisplay">120 BPM</div>
        <div class="status" id="status">Ready</div>
        <div class="beat-indicator" id="beatIndicator"></div>
        <button class="control-button start-button" id="startButton" onclick="startMetronome()">Start</button>
        <button class="control-button stop-button" id="stopButton" onclick="stopMetronome()" style="display:none;">Stop</button>
    </div>

    <script>
        let synth;
        let loop;
        let currentBeat = 0;
        let isPlaying = false;
        
        let bpm = 120;
        let beatsPerMeasure = 4;
        let subdivision = 1;
        let accentBeats = [1];
        let swingRatio = 0.67;
        let clickOnBeats = [1, 2, 3, 4];
        
        function initializeTone() {
            if (!synth) {
                synth = new Tone.Synth({
                    oscillator: { type: 'sine' },
                    envelope: {
                        attack: 0.001,
                        decay: 0.05,
                        sustain: 0,
                        release: 0.05
                    }
                }).toDestination();
            }
        }
        
        function updateBeatIndicator() {
            const indicator = document.getElementById('beatIndicator');
            indicator.innerHTML = '';
            
            for (let i = 1; i <= beatsPerMeasure; i++) {
                const beat = document.createElement('div');
                beat.className = 'beat';
                beat.id = `beat-${i}`;
                beat.textContent = i;
                
                if (accentBeats.includes(i)) {
                    beat.classList.add('accent');
                }
                
                indicator.appendChild(beat);
            }
        }
        
        function playClick(beatNumber) {
            if (!clickOnBeats.includes(beatNumber)) {
                return;
            }
            
            const isAccent = accentBeats.includes(beatNumber);
            const frequency = isAccent ? 1200 : 800;
            const duration = '32n';
            
            synth.triggerAttackRelease(frequency, duration);
            
            document.querySelectorAll('.beat').forEach(b => b.classList.remove('active'));
            const beatElement = document.getElementById(`beat-${beatNumber}`);
            if (beatElement) {
                beatElement.classList.add('active');
            }
        }
        
        async function startMetronome() {
            if (isPlaying) return;
            
            await Tone.start();
            initializeTone();
            
            Tone.Transport.bpm.value = bpm;
            
            currentBeat = 0;
            
            loop = new Tone.Loop((time) => {
                currentBeat = (currentBeat % beatsPerMeasure) + 1;
                
                Tone.Draw.schedule(() => {
                    playClick(currentBeat);
                }, time);
                
            }, `${beatsPerMeasure}n`);
            
            loop.start(0);
            Tone.Transport.start();
            
            isPlaying = true;
            document.getElementById('startButton').style.display = 'none';
            document.getElementById('stopButton').style.display = 'inline-block';
            document.getElementById('status').textContent = 'Playing...';
        }
        
        function stopMetronome() {
            if (!isPlaying) return;
            
            if (loop) {
                loop.stop();
                loop.dispose();
            }
            
            Tone.Transport.stop();
            Tone.Transport.cancel();
            
            isPlaying = false;
            currentBeat = 0;
            
            document.querySelectorAll('.beat').forEach(b => b.classList.remove('active'));
            document.getElementById('startButton').style.display = 'inline-block';
            document.getElementById('stopButton').style.display = 'none';
            document.getElementById('status').textContent = 'Stopped';
        }
        
        function updateSettings(settings) {
            const wasPlaying = isPlaying;
            
            if (wasPlaying) {
                stopMetronome();
            }
            
            bpm = settings.bpm || 120;
            beatsPerMeasure = settings.beats || 4;
            subdivision = settings.subdivision || 1;
            accentBeats = settings.accentBeats || [1];
            swingRatio = settings.swingRatio || 0.67;
            clickOnBeats = settings.clickOnBeats || [1, 2, 3, 4];
            
            document.getElementById('bpmDisplay').textContent = `${bpm} BPM`;
            updateBeatIndicator();
            
            if (wasPlaying) {
                setTimeout(() => startMetronome(), 100);
            }
        }
        
        window.addEventListener('message', (event) => {
            if (event.data.type === 'updateSettings') {
                updateSettings(event.data.settings);
            } else if (event.data.type === 'start') {
                startMetronome();
            } else if (event.data.type === 'stop') {
                stopMetronome();
            }
        });
        
        updateBeatIndicator();
    </script>
</body>
</html>
