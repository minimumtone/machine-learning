stability_terms:
  stable:
    description: thermodynamically stable
    condition:
      column: phase_stability.is_stable
      operator: "="
      value: "TRUE"

  unstable:
    description: thermodynamically unstable
    condition:
      column: phase_stability.is_stable
      operator: "="
      value: "FALSE"

  metastable:
    description: metastable within 50 meV/atom
    condition:
      column: phase_stability.energy_above_hull
      operator: "<="
      value: 0.05
      unit: eV/atom

property_terms:
  formation_energy:
    aliases:
      - formation energy
      - "\u5F62\u6210\u30A8\u30CD\u30EB\u30AE\u30FC"
      - "\u751F\u6210\u30A8\u30CD\u30EB\u30AE\u30FC"
    column: phase_stability.formation_energy_per_atom

  lattice_constant:
    aliases:
      - lattice constant
      - "\u683C\u5B50\u5B9A\u6570"
      - lattice_a
    column: structure.lattice_a

  bulk_modulus:
    aliases:
      - bulk modulus
      - "\u4F53\u7A4D\u5F3E\u6027\u7387"
      - "\u30D0\u30EB\u30AF\u30E2\u30B8\u30E5\u30E9\u30B9"
    column: elastic_tensor.bulk_modulus_vrh

  shear_modulus:
