stability_terms:
  stable:
    description: thermodynamically stable
    condition:
      column: phase_stability.energy_above_hull
      operator: "<="
      value: 0.001
      unit: eV/atom

  metastable:
    description: metastable within 50 meV/atom
    condition:
      column: phase_stability.energy_above_hull
      operator: "<="
      value: 0.05
      unit: eV/atom

