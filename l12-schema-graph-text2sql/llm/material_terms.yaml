      - "\u30CF\u30EB\u4E0A\u30A8\u30CD\u30EB\u30AE\u30FC"
    column: phase_stability.energy_above_hull

  band_gap:
    aliases:
      - band gap
      - "\u30D0\u30F3\u30C9\u30AE\u30E3\u30C3\u30D7"
      - bandgap
    column: phase_stability.band_gap

  volume_per_atom:
    aliases:
      - volume per atom
      - "\u539F\u5B50\u3042\u305F\u308A\u4F53\u7A4D"
      - volume
    column: structure.volume_per_atom

  space_group:
    aliases:
      - space group
      - "\u7A7A\u9593\u7FA4"
      - spacegroup
    column: structure.space_group

# Column synonym corrections: LLM-hallucinated name → correct table.column
# Used by sql_validator to suggest corrections in repair loop
column_synonyms:
  # composition table
  "composition.fractional_amount": "composition.atomic_fraction"
  "composition.fraction": "composition.atomic_fraction"
  "composition.atomic_percent": "composition.atomic_fraction"
  "composition.weight_fraction": "composition.atomic_fraction"
  "composition.element_id": "composition.element"
  "composition.atomic_number": "element.atomic_number"
  # structure table
  "structure.volume": "structure.volume_per_atom"
  "structure.cell_volume": "structure.volume_per_atom"
  "structure.lattice_volume": "structure.volume_per_atom"
  # calculation table
  "calculation.xc_functional": "calculation.functional"
  "calculation.exchange_correlation": "calculation.functional"
  # surface_energy table
  "surface_energy.surface_reconstruction": "surface_energy.is_reconstructed"
  "surface_energy.surface_orientation": "surface_energy.miller_index"
  "surface_energy.orientation": "surface_energy.miller_index"
  # elastic_tensor table
  "elastic_tensor.bulk_modulus": "elastic_tensor.bulk_modulus_vrh"
  "elastic_tensor.shear_modulus": "elastic_tensor.shear_modulus_vrh"
  # material_entry table
  "material_entry.name": "material_entry.formula"
  "material_entry.compound": "material_entry.formula"
  # phase_stability table
  "phase_stability.stability": "phase_stability.is_stable"
  "phase_stability.formation_energy": "phase_stability.formation_energy_per_atom"
  # magnetic_property table
  "magnetic_property.magnetization": "magnetic_property.total_magnetization"
  "magnetic_property.curie_temperature": "magnetic_property.curie_temperature_k"
  # thermal_property table
  "thermal_property.debye_temperature": "thermal_property.debye_temperature_k"
  # density_of_states table
  "density_of_states.dos_at_fermi": "density_of_states.total_dos_at_fermi"
  # material_defect table
  "material_defect.defect_type": "material_defect.defect_type_id"

# Value mappings: correct literal values to use in WHERE clauses
