  grain_boundary_energy:
    aliases:
      - "\u7C92\u754C\u30A8\u30CD\u30EB\u30AE\u30FC"
      - grain boundary
    column: grain_boundary.gb_energy_j_m2

  vacancy_formation:
    aliases:
      - "\u7A7A\u5B54\u5F62\u6210\u30A8\u30CD\u30EB\u30AE\u30FC"
      - vacancy
