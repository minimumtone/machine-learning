      - "\u305B\u3093\u65AD\u5F3E\u6027\u7387"
      - "\u30B7\u30A2\u30E2\u30B8\u30E5\u30E9\u30B9"
    column: elastic_tensor.shear_modulus_vrh

  youngs_modulus:
    aliases:
      - "Young's modulus"
      - "\u30E4\u30F3\u30B0\u7387"
      - youngs modulus
    column: elastic_tensor.youngs_modulus

  poisson_ratio:
    aliases:
      - Poisson ratio
      - "\u30DD\u30A2\u30BD\u30F3\u6BD4"
