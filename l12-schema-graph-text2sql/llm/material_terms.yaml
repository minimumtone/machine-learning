  total_magnetization:
    aliases:
      - "\u78C1\u6C17\u30E2\u30FC\u30E1\u30F3\u30C8"
      - magnetization
      - magnetic moment
    column: magnetic_property.total_magnetization

  magnetic_ordering:
    aliases:
      - "\u5F37\u78C1\u6027"
      - ferromagnetic
      - "\u78C1\u6C17\u79E9\u5E8F"
      - magnetic ordering
    column: magnetic_property.magnetic_ordering

  curie_temperature:
    aliases:
      - "\u30AD\u30E5\u30EA\u30FC\u6E29\u5EA6"
      - Curie temperature
    column: magnetic_property.curie_temperature_k

  magnetic_anisotropy:
    aliases:
      - "\u78C1\u6C17\u7570\u65B9\u6027\u30A8\u30CD\u30EB\u30AE\u30FC"
      - magnetic anisotropy
    column: magnetic_property.magnetic_anisotropy_energy

  debye_temperature:
    aliases:
      - "\u30C7\u30D0\u30A4\u6E29\u5EA6"
      - Debye temperature
    column: thermal_property.debye_temperature_k

  thermal_conductivity:
    aliases:
      - "\u71B1\u4F1D\u5C0E\u7387"
      - thermal conductivity
    column: thermal_property.thermal_conductivity

  gruneisen_parameter:
    aliases:
      - "\u30B0\u30EA\u30E5\u30CA\u30A4\u30BC\u30F3\u5B9A\u6570"
      - Gruneisen
