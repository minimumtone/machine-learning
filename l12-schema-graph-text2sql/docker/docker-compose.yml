services:
  postgres:
    image: postgres:15
    container_name: ${L12_CONTAINER_NAME:-l12_postgres}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-l12_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-l12_password}
      POSTGRES_DB: ${POSTGRES_DB:-l12_materials}
    ports:
      - "127.0.0.1:${L12_PGPORT:-5432}:5432"
    volumes:
      - ../db/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
      - ../db/002_reference_data.sql:/docker-entrypoint-initdb.d/002_reference_data.sql
      - ../db/003_material_data.sql:/docker-entrypoint-initdb.d/003_material_data.sql
      - ../db/004_views.sql:/docker-entrypoint-initdb.d/004_views.sql
      - ../db/005_roles.sql:/docker-entrypoint-initdb.d/005_roles.sql
